[package]
name = "wasm_activation"
version = "0.1.0"
edition = "2024"
description = "WASM module for NEAT-AI creature activation - prototype for Issue #1116"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2.108"
js-sys = "0.3.85"

[profile.release]
opt-level = 3
lto = true

[profile.release.package."*"]
opt-level = 3

# Issue #1178 - WASM SIMD support
# Note: SIMD is enabled via RUSTFLAGS in build.sh, not here.
# This comment documents the SIMD feature requirement.
