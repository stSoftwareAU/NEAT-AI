[package]
name = "wasm_activation"
version = "0.1.0"
edition = "2024"
description = "WASM module for NEAT-AI creature activation - prototype for Issue #1116"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2.118"
js-sys = "0.3.95"
neat-core = { workspace = true }


# Profile settings are in the workspace root Cargo.toml.
# Issue #1178 - WASM SIMD support: SIMD is enabled via RUSTFLAGS in build.sh.
