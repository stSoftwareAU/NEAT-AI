# A config file at the scan target's root *replaces* gitleaks' built-in
# ruleset rather than adding to it, so without this stanza the repository was
# scanned with zero rules — a green scan that could never find anything
# (Issue #3950). `useDefault` restores the built-in rules; the allowlist below
# then subtracts from them.
[extend]
  useDefault = true

[allowlist]
  description = "Allowlist for known false positives"

  # test/NEAT/DeDuplicateRetryCap.ts previously used a variable named
  # `testKey` with a short placeholder string during initial development.
  # This is not a real secret — the value was a test fixture and was later
  # renamed to `testUuid` with a proper UUID. Suppressed via commit allowlist.
  commits = [
    "c5b6232772733ed219563dd0b341241eee2fc8c8",
  ]

  # docs/archive/pr-summaries/pr-summary-3950.md quoted a synthetic GitHub PAT
  # — the digits 0-9 repeated three times followed by `abcdef` — as evidence
  # that the licence-less fallback detects a planted secret. The literal has
  # been removed from that file, but it stays in the branch's history, so a
  # range scan still reports it. The pattern is written out rather than
  # allowlisting the whole commit so every other secret in it is still caught,
  # and its fixed digits cannot match a real token.
  regexes = [
    '''ghp_(?:0123456789){3}abcdef''',
  ]
