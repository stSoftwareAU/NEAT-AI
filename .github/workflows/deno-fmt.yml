name: Format Code Automatically with Deno 2.1

on:
  push:
    branches-ignore:
      - develop # Exclude the develop branch
  workflow_dispatch: # Allow manual trigger if needed

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      # Checkout the code
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ACTIONS_PUSH }} # Use the GitHub Actions token for write access

      # Set up Deno 2.1 (Explicit version)
      - name: Setup Deno
        uses: denoland/setup-deno@v2

      # Run Deno fmt
      - name: Format Code
        run: deno fmt

      # Check for Changes
      - name: Check for Changes
        id: changes  # Set an ID for referencing the output
        run: |
          git diff --quiet || echo "changes=true" >> $GITHUB_ENV

      # Commit Changes
      - name: Commit Changes
        if: env.changes == 'true'  # Only run if there are changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: apply deno fmt"

      # Push Changes
      - name: Push Changes
        if: env.changes == 'true'  # Only run if there are changes
        run: |
          git push origin
          #git remote set-url origin https://${{ secrets.ACTIONS_PUSH }}@github.com/stSoftwareAU/NEAT-AI.git
          #git push origin ${{ github.ref_name }}
