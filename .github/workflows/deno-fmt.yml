name: Format Code Automatically with Deno 2.1

on:
  push:
    branches-ignore:
      - develop # Exclude the develop branch
  workflow_dispatch: # Allow manual trigger if needed

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      # Checkout the code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Set up Deno 2.1 (Explicit version)
      - name: Setup Deno
        uses: denoland/setup-deno@v2

      # Run Deno fmt
      - name: Format Code
        run: deno fmt
  
      # Check for Changes and Commit
      - name: Commit Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet || git commit -am "chore: apply deno fmt"
        continue-on-error: true  # Ensure workflow doesn't fail if there's nothing to commit
  
      # Push Changes with an updated action
      - name: Push Changes
        if: success()
        uses: github-actions-x/commit@v2.9
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref_name }}
