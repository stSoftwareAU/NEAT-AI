name: Format Code Automatically with Deno 2.1

on:
  push:
    branches-ignore:
      - develop # Exclude the develop branch
  workflow_dispatch: # Allow manual trigger if needed

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      # Checkout the code
      - name: Checkout Code
        uses: actions/checkout@v3

      # Set up Deno 2.1 (Explicit version)
      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.1

      # Run Deno fmt
      - name: Format Code
        run: deno fmt

      # Check for Changes
      - name: Check for Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet || git commit -am "chore: apply deno fmt" || exit 0

      # Push Changes
      - name: Push Changes
        if: success()
        uses: ad-m/github-push-action@v0.6.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref_name }}
