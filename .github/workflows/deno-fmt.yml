name: Format Code Automatically with Deno 2.1

on:
  push:
    branches-ignore:
      - develop # Exclude the develop branch
  workflow_dispatch: # Allow manual trigger if needed

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      # Checkout the code
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ACTIONS_PUSH }} # Use the GitHub Actions token for write access

      # Set up Deno 2.1 (Explicit version)
      - name: Setup Deno
        uses: denoland/setup-deno@v2

      # Run Deno fmt
      - name: Format Code
        run: deno fmt

      # Check for Changes and Commit
      - name: Commit Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet || git commit -am "chore: apply deno fmt"
        continue-on-error: true  # Prevent the workflow from failing if there's nothing to commit

      # Push Changes
      - name: Push Changes
        if: steps.commit_changes.outcome == 'success'  # Push only if there are changes
        run: |
          git remote set-url origin https://${{ secrets.ACTIONS_PUSH }}@github.com/stSoftwareAU/NEAT-AI.git
          git push origin ${{ github.ref_name }}
