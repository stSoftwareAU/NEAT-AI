name: Format Code Automatically with Deno 2

on:
  push:
    branches-ignore:
      - develop # Exclude the develop branch
  workflow_dispatch: # Allow manual trigger if needed

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      # Checkout the code
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ACTIONS_PUSH }}  # Use the GitHub Actions token for write access

      # Set up Deno 2.x
      - name: Setup Deno
        uses: denoland/setup-deno@v2

      - name: Update Deno
        run: deno outdated --update --latest

      # Run Deno fmt
      - name: Format Code
        run: deno fmt

      - name: Lint Code
        run: deno lint --fix src test bench mod.ts

      # Check for Changes
      - name: Check for Changes
        id: check_changes  # Set an ID for referencing outputs
        run: |
          echo "has_changes=$(git diff --quiet || echo true)" >> $GITHUB_ENV

      # Commit Changes
      - name: Commit Changes
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: apply deno fmt"

      # Push Changes
      - name: Push Changes
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git push origin
