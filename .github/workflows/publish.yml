name: Publish

on:
  push:
    branches:
      - Develop

# Serialise JSR publish runs but NEVER cancel one mid-flight: cancel-in-progress
# is false so an in-progress publish is never interrupted (Issue #2842).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Defence in depth (Issue #2904): the push trigger already restricts to
    # Develop, but make the branch requirement explicit so the job never runs
    # on any other ref.
    if: github.ref == 'refs/heads/Develop'
    permissions:
      contents: read
      id-token: write # OIDC for JSR (provenance + tokenless publish)
    steps:
      # actions/checkout@v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Deno
        # denoland/setup-deno@v2.0.4
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282
        with:
          deno-version: v2.x

      # Issue #2439: --verify-only matches CI policy in
      # docs/CORE_DEPENDENCY_POLICY.md — CI must not resolve NEAT-AI-core
      # HEAD or auto-advance neatCore.rev. The vendored wasm_activation/pkg
      # is committed and pinned by deno.json neatCore.rev; verify it is in
      # sync before publishing to JSR.
      - name: Verify WASM package matches deno.json neatCore.rev
        run: ./build.sh --verify-only

      # Issue #2904: skip publishing when deno.json's version is already on JSR.
      # Every push to Develop runs this workflow, but the package version only
      # changes on a release commit. Re-running `jsr publish` for an existing
      # version hangs the CLI until the 15-minute job timeout cancels it, so
      # gate the publish step on the version being new. A 200 from the JSR
      # version meta endpoint means the version is published; 404 means it is
      # not.
      - name: Determine whether the version needs publishing
        id: needs_publish
        run: |
          set -Eeuo pipefail
          name=$(jq -r .name deno.json)
          version=$(jq -r .version deno.json)
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://jsr.io/${name}/${version}_meta.json")
          if [ "$status" = "200" ]; then
            echo "${name}@${version} is already published on JSR; skipping publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif [ "$status" = "404" ]; then
            echo "${name}@${version} is not on JSR; will publish."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "Unexpected HTTP ${status} from JSR meta endpoint; attempting publish." >&2
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      # Tokenless publish: package must be linked to this repo on JSR.
      # For runs triggered by bots (e.g. stservice): scope admin must disable
      # "Only allow publishing when triggered by a scope member" in scope settings.
      # See https://jsr.io/docs/scopes#github-actions-publishing-security
      - name: Publish to JSR
        if: steps.needs_publish.outputs.publish == 'true'
        run: npx jsr publish

      # Issue #3008 (SCR-SBOM): emit a machine-readable Software Bill of
      # Materials for the published version. Deno has no first-class SBOM
      # emitter, so generate a CycloneDX document over the committed deno.lock
      # (-t deno) — the same resolved tree that ships. Downstream consumers use
      # this to answer "did the version I depend on include the compromised
      # package?" without re-resolving the dependency graph.
      - name: Generate CycloneDX SBOM
        if: steps.needs_publish.outputs.publish == 'true'
        run: deno run -A npm:@cyclonedx/cdxgen -t deno -o sbom.cdx.json .

      # Pinned per github-actions-audit (SCR-ACTIONS-PIN): 40-char commit SHA,
      # not a moving tag. Same release as coverage.yaml's upload-artifact.
      - name: Upload SBOM
        if: steps.needs_publish.outputs.publish == 'true'
        # actions/upload-artifact@v7.0.1 — Node 24 runtime (Issue #2767)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sbom
          path: sbom.cdx.json
          if-no-files-found: error
