name: Publish

on:
  push:
    branches:
      - Develop

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # JSR_TOKEN: use a token from a @stsoftware scope member so publish works
      # regardless of which GitHub actor (e.g. stservice) triggered the run.
      # Create at https://jsr.io → account → Access Tokens; store as repo secret.
      - name: Publish to JSR
        run: deno publish --token "${{ secrets.JSR_TOKEN }}"
