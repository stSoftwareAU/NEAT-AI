name: Benchmarks

# Runs a fast benchmark smoke pass so the `bench/` Deno.bench suites are
# actually executed on every change to the benchmarks or their runner config
# (Issue #3175). This is deliberately a small, fast subset — the full
# benchmark suite (`deno task bench`) is a long-running, manual/nightly
# command. Fanning the full suite across a CI matrix and the OOM hardening
# are tracked as separate sub-issues of #3169.

on:
  pull_request:
    # Milestone sub-issue PRs target a shared `milestone/<slug>` branch, so a
    # `Develop`-only filter skipped this gate on them (Issue #3606). Milestone
    # branch names have no nested slashes, so a single-level glob is enough.
    branches:
      - Develop
      - milestone/*
    paths:
      - "bench/**"
      - "deno.json"
      - ".github/workflows/bench.yaml"
  # Weekly scheduled run drives the score-per-hour regression gate (Issue
  # #3398) against the checked-in baseline trajectory.
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

# Cancel superseded runs on the same ref so rapid pushes don't pile up.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege GITHUB_TOKEN scopes: the job only reads the repo and
# uploads an artifact.
permissions:
  contents: read

jobs:
  smoke:
    name: Benchmark smoke
    runs-on: ubuntu-latest
    # The smoke subset is fast; keep a generous cap purely as a wedge guard.
    timeout-minutes: 20
    env:
      NEAT_RUST_DISCOVERY_OPTIONAL: "true"
    steps:
      - name: Checkout Code
        # `persist-credentials: false` (Issue #3349) — the default `true`
        # writes the workflow `GITHUB_TOKEN` into `.git/config` as an auth
        # header for the rest of the job. This smoke job only reads the repo
        # and uploads an artifact; it never pushes back or fetches private
        # submodules, so the persisted credential is unnecessary and keeping
        # it on disk only widens the blast radius of a compromised step.
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Deno
        # denoland/setup-deno@v2.0.4
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282

      - name: Sync WASM package from NEAT-AI-core
        run: ./build.sh --verify-only

      - name: Run benchmark smoke pass
        run: |
          set -Eeuo pipefail
          export NO_COLOR=true
          deno task bench:smoke | tee bench-smoke-output.txt

      - name: Upload benchmark output
        if: ${{ always() }}
        # actions/upload-artifact@v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bench-smoke-output
          path: bench-smoke-output.txt
          retention-days: 7
          if-no-files-found: warn

  score-per-hour-regression:
    name: Score-per-hour regression gate
    # Only on the weekly schedule / manual dispatch — this runs a real
    # (bounded) evolution and is slower than the smoke pass (Issue #3398).
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEAT_RUST_DISCOVERY_OPTIONAL: "true"
    steps:
      - name: Checkout Code
        # `persist-credentials: false` (Issue #3349) — this job only reads the
        # repo and uploads an artifact; it never pushes back.
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Deno
        # denoland/setup-deno@v2.0.4
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282

      - name: Sync WASM package from NEAT-AI-core
        run: ./build.sh --verify-only

      - name: Run score-per-hour harness against the baseline trajectory
        # Same seeded config as bench/baseline_score_trajectory.json. The gate
        # fails (non-zero exit) if the deterministic evolution outcome regresses
        # below the checked-in baseline, or if the run produced no score samples
        # (silent-failure guard). Score/hour drift is reported as an advisory
        # warning, not a hard failure, because wall-clock timing is
        # machine-load-dependent.
        run: |
          set -Eeuo pipefail
          export NO_COLOR=true
          deno run --allow-read --allow-write --allow-env --allow-ffi \
            bench/score_per_hour_harness.ts \
            --scale=grq-3397 --inputs=2461 --outputs=2 --samples=20 \
            --population=10 --max-generations=10 --time-budget-ms=600000 \
            --seed=3396 --train-per-gen=0 \
            --baseline=bench/baseline_score_trajectory.json \
            --out=score-per-hour-trajectory.json 2>&1 | tee score-per-hour-output.txt

      - name: Upload score-per-hour trajectory
        if: ${{ always() }}
        # actions/upload-artifact@v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: score-per-hour-trajectory
          path: |
            score-per-hour-trajectory.json
            score-per-hour-output.txt
          retention-days: 30
          if-no-files-found: warn
