name: Fix Refinery social assets

on:
  push:
    branches:
      - social/neat-ai-refinery
    paths:
      - .github/workflows/fix-refinery-social.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: social/neat-ai-refinery
          fetch-depth: 0

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Render the Refinery preview from the brand source of truth
        run: |
          rm -rf /tmp/refinery-social
          deno run -A scripts/brand/render_social_previews.ts --out /tmp/refinery-social
          cp /tmp/refinery-social/neat-ai-refinery.png docs/brand/social-previews/neat-ai-refinery.png
          cp /tmp/refinery-social/opaque/neat-ai-refinery.png docs/brand/social-previews/opaque/neat-ai-refinery.png
          cp /tmp/refinery-social/github/neat-ai-refinery.png docs/brand/social-previews/github/neat-ai-refinery.png

      - name: Commit generated assets and remove this one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/brand/social-previews/neat-ai-refinery.png
          git add docs/brand/social-previews/opaque/neat-ai-refinery.png
          git add docs/brand/social-previews/github/neat-ai-refinery.png
          git rm .github/workflows/fix-refinery-social.yml
          git commit -m "🏭 Complete NEAT-AI-Refinery social preview set"
          git push origin HEAD:social/neat-ai-refinery
