name: Quality reviews

on:
  pull_request:
    branches:
      - Develop
      # Also gate milestone sub-issue PRs. They target a shared
      # `milestone/<slug>` branch (planning delivery workflow); without this
      # glob the quality gate never ran on them and they merged into the
      # milestone branch unchecked (Issue #3362). Milestone names have no
      # nested slashes, so the single-level `milestone/*` glob is sufficient.
      - milestone/*
  workflow_dispatch: # Allow manual trigger if needed

# Cancel superseded runs on the same ref so rapid successive pushes don't
# pile up redundant (heavy) quality runs (Issue #2842).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege GITHUB_TOKEN scopes (Issue #2706). The push back to the PR
# branch uses secrets.ACTIONS_PUSH (a PAT), not the default GITHUB_TOKEN, so the
# default token only needs read access.
permissions:
  contents: read

jobs:
  # Everything in this job runs code from the pull request head — `build.sh`,
  # `deno check`/`fmt`/`lint`, and the repo's own scripts. It therefore holds
  # NO credential beyond the default read-scoped `GITHUB_TOKEN` (Issue #3607).
  # Any fmt/lint fixes leave as a patch artefact for the `push-fixes` job,
  # which is the only place `secrets.ACTIONS_PUSH` appears.
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEAT_RUST_DISCOVERY_OPTIONAL: "true"
    outputs:
      has_changes: ${{ steps.check_changes.outputs.has_changes }}

    steps:
      # Checkout the code.
      #
      # The fetch uses the default `GITHUB_TOKEN` (scoped `contents: read`
      # above) — read access is all this job needs, and keeping the
      # privileged PAT out of the job that executes PR-controlled code is
      # the point of the split (Issue #3607).
      #
      # `persist-credentials: false` (Issue #2727) — the default `true`
      # writes the fetch token into `.git/config`
      # (`http.https://github.com/.extraheader = AUTHORIZATION: basic …`)
      # for the rest of the job, where PR-controlled code could read it.
      - name: Checkout Code
        # actions/checkout@v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          # For pull_request events, explicitly checkout the PR head branch so
          # the checks see exactly what the contributor pushed.
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          fetch-depth: 0

      - name: Check Bash Script Syntax
        run: |
          set -Eeuo pipefail
          echo "Checking bash script syntax..."
          fail=0
          while IFS= read -r f; do
            if ! bash -n "$f"; then
              echo "❌ syntax error in $f" >&2
              fail=1
            else
              echo "✅ $f"
            fi
          done < <(find . -name "*.sh" -type f)
          exit $fail

      - name: Check for Zero-Length Files
        run: |
          set -Eeuo pipefail
          echo "Checking for zero-length files..."
          fail=0
          while IFS= read -r f; do
            if [[ ! -s "$f" ]]; then
              echo "❌ Zero-length file detected: $f" >&2
              fail=1
            fi
          done < <(find . -type f \( -name "*.json" -o -name "*.ts" -o -name "*.js" -o -name "*.sh" \) ! -path "*/node_modules/*" ! -path "*/.git/*")
          if [[ $fail -eq 1 ]]; then
            echo "❌ Zero-length files found. All files must have content." >&2
            exit 1
          fi
          echo "✅ No zero-length files found"

      - name: Check for Merge Conflict Markers
        run: |
          set -Eeuo pipefail
          echo "Checking for merge conflict markers..."
          fail=0
          while IFS= read -r f; do
            if grep -qE '^(<{7}|={7}|>{7})' "$f" 2>/dev/null; then
              echo "❌ Merge conflict markers found in: $f" >&2
              fail=1
            fi
          done < <(find . -type f \( -name "*.ts" -o -name "*.js" -o -name "*.json" -o -name "*.sh" \) ! -path "*/node_modules/*" ! -path "*/.git/*")
          if [[ $fail -eq 1 ]]; then
            echo "❌ Merge conflict markers detected. Please resolve conflicts before submitting." >&2
            exit 1
          fi
          echo "✅ No merge conflict markers found"

      - name: Validate JSON Files
        run: |
          set -Eeuo pipefail
          echo "Validating JSON files..."
          if ! command -v jq &> /dev/null; then
            echo "Installing jq..."
            sudo apt-get update && sudo apt-get install -y jq
          fi
          fail=0
          while IFS= read -r f; do
            if ! jq empty "$f" > /dev/null 2>&1; then
              echo "❌ Invalid JSON: $f" >&2
              jq empty "$f" 2>&1 || true
              fail=1
            else
              echo "✅ $f"
            fi
          done < <(find . -name "*.json" -type f ! -path "*/node_modules/*" ! -path "*/.git/*")
          if [[ $fail -eq 1 ]]; then
            echo "❌ JSON validation failed. Please fix invalid JSON files." >&2
            exit 1
          fi
          echo "✅ All JSON files are valid"

      - name: Check for Large Files
        run: |
          set -Eeuo pipefail
          echo "Checking for unexpectedly large files..."
          # Check for files larger than 10MB (excluding expected large files like models)
          fail=0
          while IFS= read -r f; do
            size=$(stat -f%z "$f" 2>/dev/null || stat -c%s "$f" 2>/dev/null || echo "0")
            if [[ $size -gt 10485760 ]]; then  # 10MB in bytes
              # Allow large JSON model files in docs/models directory
              if [[ "$f" == *.json ]] && [[ "$f" == */docs/models/* ]]; then
                echo "⚠️  Large model file detected (allowed): $f ($(numfmt --to=iec-i --suffix=B "$size" 2>/dev/null || echo "${size} bytes"))" >&2
              else
                echo "❌ Unexpectedly large file: $f ($(numfmt --to=iec-i --suffix=B "$size" 2>/dev/null || echo "${size} bytes"))" >&2
                fail=1
              fi
            fi
          done < <(find . -type f ! -path "*/node_modules/*" ! -path "*/.git/*" ! -path "*/.trace/*" ! -path "*/.test/*" ! -path "*/.coverage/*")
          if [[ $fail -eq 1 ]]; then
            echo "❌ Unexpectedly large files found. Please review before committing." >&2
            exit 1
          fi
          echo "✅ No unexpectedly large files found"

      # Fetch base branch for PR comparison (only needed for pull_request events)
      - name: Fetch Base Branch
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin Develop:Develop || true

      - name: Detect Secrets with gitleaks
        # gitleaks/gitleaks-action@v2.3.9
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }} # License key for organization scanning
      # Note: gitleaks-action@v2 automatically detects PRs and scans the diff
      # For workflow_dispatch, it scans the entire repository by default

      # Set up Deno 2.x and verify the vendored WASM bundle matches
      # deno.json's neatCore.rev. Shared with coverage.yaml, bench.yaml and
      # publish.yml via the local composite action (Issue #3608), so the
      # setup-deno pin and the `./build.sh --verify-only` policy live in one
      # file. Local `uses: ./…` actions load from the workspace, so this must
      # follow the checkout above.
      - name: Setup Deno and sync WASM package
        uses: ./.github/actions/setup-neat

      # Note: dep bumps flow through the scheduled
      # `.github/workflows/deno-outdated.yml` workflow, which raises a
      # reviewable PR via peter-evans/create-pull-request. The previous
      # inline `Update Deno` step on every PR pulled whatever version
      # was newest at run-time and auto-committed the lockfile changes
      # under the bot's signature, bypassing contributor review and the
      # bump quarantine for external deps (Issue #2697).

      - name: Report WASM sync changes
        run: |
          set -Eeuo pipefail
          changed="$(git diff --name-only)"
          if echo "$changed" | grep -q '^wasm_activation/pkg/'; then
            echo "ℹ️ wasm_activation/pkg changed after syncing latest NEAT-AI-core."
          fi

      - name: Check
        run: |
          deno check

      # Format Code
      - name: Format Code
        run: deno fmt

      # Lint Code
      - name: Lint Code
        run: deno lint --fix src test bench mod.ts

      - name: Make executable
        run: find . -type f -name "*.sh" -exec chmod u+x {} +

      # Check for Changes — capture the fmt/lint fixes as a patch so the
      # privileged `push-fixes` job can apply them as data without ever
      # executing anything from the PR tree (Issue #3607). `--binary` keeps
      # any `wasm_activation/pkg` deltas applicable.
      - name: Check for Changes
        id: check_changes # Define step ID to use outputs
        env:
          PATCH_FILE: ${{ runner.temp }}/quality-fixes.patch
        run: |
          set -Eeuo pipefail
          if git diff --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            git diff --binary > "$PATCH_FILE"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Fix Patch
        if: steps.check_changes.outputs.has_changes == 'true'
        # actions/upload-artifact@v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: quality-fix-patch
          path: ${{ runner.temp }}/quality-fixes.patch
          retention-days: 1
          if-no-files-found: error

      # Note: Tests are run in coverage.yaml workflow
      # - coverage.yaml runs all tests with full permissions (including FFI) for coverage reporting
      # - Discovery tests gracefully skip when Rust library is unavailable via ignore: !isRustDiscoveryEnabled()
      # - No need to run tests here as they're already covered in the coverage workflow

  # The only job that sees `secrets.ACTIONS_PUSH` (Issue #3607). It executes
  # nothing from the checked-out tree: it applies the fmt/lint patch produced
  # by `quality` as pure data, commits it, and pushes. Because a fresh
  # checkout runs here, no `$GITHUB_PATH` entry, `$GITHUB_ENV` variable or
  # repo-local git config planted by PR-controlled code in `quality` can reach
  # the push.
  push-fixes:
    needs: quality
    if: needs.quality.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        # actions/checkout@v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          fetch-depth: 0

      # Ensure we're on the correct branch and prevent pushing to protected
      # branches. The branch name is derived from the GitHub context and
      # re-validated here — never taken from the `quality` job's outputs,
      # which PR-controlled code can write to freely.
      #
      # Untrusted GitHub-context strings (the PR source branch name is
      # attacker-controllable) are passed via env: rather than interpolated
      # into the script body, so shell metacharacters in branch names cannot
      # break out of quoting (Issue #2709).
      - name: Setup Branch
        id: branch_setup
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -Eeuo pipefail
          # Determine the branch name
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            BRANCH_NAME="$PR_HEAD_REF"
          else
            BRANCH_NAME="$GITHUB_REF_NAME"
          fi

          # Defence in depth: reject branch names that contain shell
          # metacharacters or that could be parsed as a git option. Even
          # though the value reaches git as a single argv element, a name
          # beginning with `-` would still be interpreted as a flag.
          if [[ ! "$BRANCH_NAME" =~ ^[A-Za-z0-9._/-]+$ ]] || [[ "$BRANCH_NAME" == -* ]]; then
            echo "❌ Refusing to act on suspicious branch name: $BRANCH_NAME" >&2
            exit 1
          fi

          # Protect default branch - never push to Develop
          PROTECTED_BRANCHES="Develop main master"
          for protected in $PROTECTED_BRANCHES; do
            if [[ "$BRANCH_NAME" == "$protected" ]]; then
              echo "❌ Cannot push to protected branch: $BRANCH_NAME" >&2
              echo "Protected branches can only be updated via PR." >&2
              exit 1
            fi
          done

          # Ensure we're on the branch (checkout@v4 with ref: may leave us in
          # detached HEAD). `--` after the branch name ends option parsing
          # before any pathspecs (none here), preserving git's
          # branch-switch semantics.
          git checkout "$BRANCH_NAME" -- 2>/dev/null || git checkout -b "$BRANCH_NAME" --

          echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"

      - name: Download Fix Patch
        # actions/download-artifact@v8.0.1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: quality-fix-patch
          path: ${{ runner.temp }}/fix-patch

      - name: Apply Fix Patch
        env:
          PATCH_FILE: ${{ runner.temp }}/fix-patch/quality-fixes.patch
        run: |
          set -Eeuo pipefail
          if [[ ! -s "$PATCH_FILE" ]]; then
            echo "❌ Expected a non-empty fmt/lint patch at $PATCH_FILE" >&2
            exit 1
          fi

          # Defence in depth: the patch was produced by the PR-controlled
          # `quality` job, so refuse anything addressing the git directory.
          # `git apply` rejects these too — fail loud before it gets there.
          if grep -qE '^(diff --git |--- |\+\+\+ )[^\n]*\.git/' "$PATCH_FILE"; then
            echo "❌ Patch addresses paths under .git/ — refusing to apply" >&2
            exit 1
          fi

          git apply --binary --whitespace=nowarn "$PATCH_FILE"

      - name: Commit Changes
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: apply deno fmt and lint fixes"

      # Push Changes — pass the (already-validated) branch name through env:
      # for consistency with the Setup Branch step (Issue #2709).
      #
      # The PAT is re-introduced here via a per-command
      # `http.https://github.com/.extraheader` so it never lives in
      # `.git/config` (Issue #2727). `GH_PAT` is passed through the step env:
      # map rather than interpolated into the script body to avoid leaking the
      # secret into shell expansion or `ps`/job-log echo paths.
      - name: Push Changes
        if: steps.branch_setup.outputs.branch_name != ''
        env:
          BRANCH_NAME: ${{ steps.branch_setup.outputs.branch_name }}
          GH_PAT: ${{ secrets.ACTIONS_PUSH }}
        run: |
          set -Eeuo pipefail
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_PAT" | base64 -w0)"
          git -c http.https://github.com/.extraheader="$AUTH_HEADER" \
            push origin "$BRANCH_NAME"
