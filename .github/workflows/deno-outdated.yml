# Deno Dependency Updates (Issue #2362, Issue #2697)
#
# Runs `deno outdated --update --latest` on a weekly schedule (and on demand)
# and opens a pull request with any version bumps via
# peter-evans/create-pull-request. This is the single source of truth for
# Deno dep bumps — the previous inline step in `quality.yml` was removed by
# Issue #2697 because it pulled fresh external versions onto every PR with
# no quarantine and auto-committed the lockfile changes under the bot.
name: Deno Dependency Updates

on:
  schedule:
    # 06:00 UTC every Monday — outside Australian business hours so any
    # resulting PR is ready for review at the start of the week.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  outdated:
    name: Run deno outdated and raise PR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        # actions/checkout@v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Deno
        # denoland/setup-deno@v2.0.4
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282
        with:
          deno-version: v2.x

      - name: Update Deno dependencies
        # Honour the dep-bump quarantine (Issue #2741): only pick up external
        # versions published more than VIBE_BUMP_QUARANTINE_HOURS hours ago, so
        # a freshly published malicious release cannot land in the auto-raised
        # PR. --minimum-dependency-age takes minutes, matching bump-deps.sh.
        env:
          VIBE_BUMP_QUARANTINE_HOURS: "24"
        run: deno outdated --update --latest --minimum-dependency-age="$((VIBE_BUMP_QUARANTINE_HOURS * 60))"

      - name: Create Pull Request
        # peter-evans/create-pull-request@v8.1.1 (node24 — Issue #2764)
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          # Authenticate with the org-level PAT so downstream workflow
          # triggers (CI checks, labels, reviewer automation) fire on the
          # raised PR. GITHUB_TOKEN-authored PRs suppress those triggers
          # until somebody pushes a new commit (Issue #1636, Issue #2780).
          # Fall back to GITHUB_TOKEN when ACTIONS_PUSH is unset.
          token: ${{ secrets.ACTIONS_PUSH || secrets.GITHUB_TOKEN }}
          commit-message: "chore: update Deno dependencies"
          title: "chore: update Deno dependencies"
          branch: chore/deno-outdated
          delete-branch: true
          body: |
            Automated Deno dependency update via
            `deno outdated --update --latest --minimum-dependency-age` with a
            24h quarantine (Issue #2741).

            Raised by `.github/workflows/deno-outdated.yml` (Issue #2362).
