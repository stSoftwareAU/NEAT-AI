name: ShellCheck

on:
  pull_request:
    # Milestone sub-issue PRs target a shared `milestone/<slug>` branch, so a
    # `Develop`-only filter skipped this gate on them (Issue #3606). Milestone
    # branch names have no nested slashes, so a single-level glob is enough.
    branches:
      - Develop
      - milestone/*
  workflow_dispatch:

# Cancel superseded runs on the same ref so rapid successive pushes don't
# pile up redundant lint runs (Issue #2842).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # `persist-credentials: false` (Issue #3357) — the default `true` writes
      # the workflow `GITHUB_TOKEN` into `.git/config` as an auth header for the
      # rest of the job. This job only reads the repo and lints shell scripts; it
      # never pushes back or fetches private submodules, so the persisted
      # credential is unnecessary and keeping it on disk only widens the blast
      # radius of a compromised step.
      # actions/checkout@v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      # Lint shell scripts with koalaman/shellcheck
      # (https://github.com/koalaman/shellcheck), preinstalled on the
      # ubuntu-latest runner. Issue #3426 dropped the unmaintained ludeeus
      # wrapper action (no release in ~42 months, no commit in ~25) and runs the
      # binary directly, removing an orphaned third-party Action from the supply
      # chain. This mirrors `scandir: .` + `severity: warning` and fails loud: a
      # non-zero shellcheck exit fails the job.
      - name: Run ShellCheck (koalaman/shellcheck)
        run: |
          shellcheck --version
          mapfile -d '' scripts < <(
            find . -name '*.sh' -type f \
              -not -path './.git/*' \
              -not -path '*/target/*' \
              -not -path '*/node_modules/*' \
              -print0
          )
          if [ "${#scripts[@]}" -eq 0 ]; then
            echo "No shell scripts found to lint" >&2
            exit 1
          fi
          printf 'Linting %d shell script(s)\n' "${#scripts[@]}"
          shellcheck --severity=warning "${scripts[@]}"
