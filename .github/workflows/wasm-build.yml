name: WASM Build

on:
  pull_request:
    branches:
      - Develop
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wasm_activation:
    name: Build wasm_activation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # Allow committing generated wasm_activation/pkg back to PR branches.
          # (Same pattern as quality.yml)
          token: ${{ secrets.ACTIONS_PUSH || github.token }}
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          fetch-depth: 0

      - name: Setup Branch (avoid detached HEAD)
        run: |
          set -Eeuo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BRANCH_NAME="${{ github.event.pull_request.head.ref }}"
          else
            BRANCH_NAME="${{ github.ref_name }}"
          fi
          git checkout "$BRANCH_NAME" 2>/dev/null || git checkout -b "$BRANCH_NAME"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo (registry + git + target)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            wasm_activation/target
          key: ${{ runner.os }}-cargo-wasm_activation-${{ hashFiles('wasm_activation/Cargo.toml', 'wasm_activation/build.sh') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm_activation-

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - name: Build WASM module
        run: |
          set -Eeuo pipefail
          chmod +x wasm_activation/build.sh
          ./wasm_activation/build.sh

      - name: Commit wasm_activation/pkg (PR branches only)
        if: github.event_name == 'pull_request'
        run: |
          set -Eeuo pipefail
          # Stage only the generated pkg output and its ignore file.
          git add -A wasm_activation/pkg wasm_activation/pkg/.gitignore

          if git diff --cached --quiet; then
            echo "No wasm_activation/pkg changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(wasm): update wasm_activation/pkg"
          git push origin "${{ github.event.pull_request.head.ref }}"

      - name: Verify build artifacts exist
        run: |
          set -Eeuo pipefail
          test -f wasm_activation/pkg/wasm_activation_bg.wasm
          test -f wasm_activation/pkg/wasm_activation_bg.wasm.d.ts
          test -f wasm_activation/pkg/wasm_activation.js
          test -f wasm_activation/pkg/wasm_activation.d.ts

          wasm_size_bytes="$(stat -c%s wasm_activation/pkg/wasm_activation_bg.wasm)"
          echo "wasm_activation_bg.wasm size: ${wasm_size_bytes} bytes"

          # Optional sanity check: fail if unexpectedly huge (10MB)
          if [ "${wasm_size_bytes}" -gt 10485760 ]; then
            echo "❌ wasm_activation_bg.wasm is larger than 10MB (${wasm_size_bytes} bytes)" >&2
            exit 1
          fi

      - name: Upload WASM package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm_activation-pkg
          path: wasm_activation/pkg/
          retention-days: 14
