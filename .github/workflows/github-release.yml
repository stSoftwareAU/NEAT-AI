name: GitHub Release

on:
  push:
    branches:
      - Develop

# Serialise release runs but NEVER cancel one mid-flight: cancel-in-progress is
# false so an in-progress release is never interrupted (Issue #2842).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout code
        # actions/checkout@v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          # No step pushes back or fetches private submodules, so the token
          # need not be persisted to .git/config (Issue #3353).
          persist-credentials: false

      - name: Read version from deno.json
        id: version
        # `-E` is pinned here by test/ci/WorkflowVersionCheckStrictMode.ts
        # (Issue #3003) — do not normalise to `set -euo pipefail`.
        run: |
          set -Eeuo pipefail
          VERSION=$(jq -r .version deno.json)
          # deno.json is outside the CODEOWNERS gate (Issue #3669), so its
          # `version` is untrusted here. $GITHUB_OUTPUT is a line-oriented
          # key=value file: a newline in the value injects extra step outputs
          # into a job holding contents: write, which controls the tag and
          # release created below (Issue #3684). Accept only a plain semver
          # token, and do not echo the rejected value back — that would be a
          # second injection point, into the workflow-command stream.
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::deno.json version is not a plain semver token; refusing to write step output" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        # softprops/action-gh-release@v3.0.0 (node24 runtime)
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          generate_release_notes: true
