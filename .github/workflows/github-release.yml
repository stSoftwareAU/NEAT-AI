name: GitHub Release

on:
  push:
    branches:
      - Develop

# Serialise release runs but NEVER cancel one mid-flight: cancel-in-progress is
# false so an in-progress release is never interrupted (Issue #2842).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout code
        # actions/checkout@v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Read version from deno.json
        id: version
        run: |
          set -Eeuo pipefail
          VERSION=$(jq -r .version deno.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        # softprops/action-gh-release@v3.0.0 (node24 runtime)
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          generate_release_notes: true
