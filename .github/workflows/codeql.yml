# CodeQL code scanning, advanced setup (stSoftwareAU/VibeCoder#2716).
#
# Replaces default setup so .github/codeql/codeql-config.yml can exclude the
# three rules that misfire on neural-network code. The languages match what
# default setup detected; none of them needs a build.
name: CodeQL

on:
  push:
    branches: [Develop]
  pull_request:
    branches: [Develop]
  schedule:
    # Weekly, Mondays 04:30 UTC, so the baseline stays fresh in a quiet week.
    - cron: "30 4 * * 1"

permissions: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript]
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Initialise CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"
