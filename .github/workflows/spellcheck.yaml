name: "Spelling"
on:
  pull_request:
    branches:
      - Develop

# Least-privilege GITHUB_TOKEN scopes (Issue #2706). The cspell action only
# reads files; no write access is required.
permissions:
  contents: read

jobs:
  spellcheck: # run the action
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      # streetsidesoftware/cspell-action@v8.4.0
      - uses: streetsidesoftware/cspell-action@de2a73e963e7443969755b648a1008f77033c5b2
        with:
          # Specify the files to check
          files: "**/*.{md,html,js,ts,css,sh}"
          config: "docs/cspell.json"
