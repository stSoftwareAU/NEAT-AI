name: "Spelling"
on:
  pull_request:
    branches:
      - Develop

# Cancel superseded runs on the same ref so rapid successive pushes don't
# pile up redundant spell-check runs (Issue #2842).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege GITHUB_TOKEN scopes (Issue #2706). The cspell action only
# reads files; no write access is required.
permissions:
  contents: read

jobs:
  spellcheck: # run the action
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions/checkout@v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          # Read-only job (spell-check + upload); do not persist the
          # GITHUB_TOKEN to .git/config (Issue #3358).
          persist-credentials: false
      # streetsidesoftware/cspell-action@v8.4.0
      - uses: streetsidesoftware/cspell-action@de2a73e963e7443969755b648a1008f77033c5b2
        with:
          # Specify the files to check
          files: "**/*.{md,html,js,ts,css,sh}"
          config: "docs/cspell.json"
