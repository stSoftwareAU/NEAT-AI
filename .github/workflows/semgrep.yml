name: Semgrep

on:
  pull_request:
    branches:
      - Develop
      # Also gate milestone sub-issue PRs. They target a shared
      # `milestone/<slug>` branch (planning delivery workflow); without this
      # glob the SAST scan never ran on them and they merged into the
      # milestone branch unchecked (Issue #3363). Milestone names have no
      # nested slashes, so the single-level `milestone/*` glob is sufficient.
      - milestone/*

# Cancel superseded runs on the same ref so rapid successive pushes don't
# pile up redundant SAST scans (Issue #2842).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep SAST scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      # Pinned to close the supply-chain hole on SEMGREP_APP_TOKEN — see #2743.
      # The release tag sits beside the digest so Renovate/Dependabot can
      # resolve a bump and rewrite both; a bare digest is immutable but frozen
      # forever (Issue #3960). Digest is the multi-arch index for 1.163.0.
      # Quarantine policy: 24h (renovate.json minimumReleaseAge).
      image: semgrep/semgrep:1.163.0@sha256:7cad2bc2d1e44f87f0bf4be6d1fa23aa90fb72015bebc89fb91385d813987a03
    steps:
      # actions/checkout@v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          # Semgrep only reads the tree; it never pushes or fetches private
          # submodules, so the GITHUB_TOKEN must not be persisted to .git/config
          # where a compromised step could read it (Issue #3356).
          persist-credentials: false
      - run: semgrep ci --config p/default --config p/security-audit --config p/owasp-top-ten
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
