[package]
name = "neat-core"
version = "0.1.0"
edition = "2024"
description = "Shared computation library for NEAT-AI neural network operations. Pure Rust with no WASM dependencies."

[lib]
crate-type = ["lib"]

# This crate must NOT depend on wasm-bindgen or js-sys.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
